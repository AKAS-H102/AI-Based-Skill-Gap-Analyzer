<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>{% block title %}SkillGap AI{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static',filename='css/app.css') }}" rel="stylesheet"></head><body><div class="bg-grid"></div><div class="orb orb-a"></div><div class="orb orb-b"></div><canvas id="particles"></canvas><nav class="navbar navbar-expand-lg navbar-dark glass"><div class="container-fluid px-4"><a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">Skill<span>Gap</span> AI</a>{% if session.get('user_id') %}<div class="d-flex align-items-center gap-3"><a class="nav-link text-light" href="{{ url_for('main.profile') }}">Profile</a><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-outline-light">Logout</button></form></div>{% endif %}</div></nav><main class="container-fluid px-3 px-lg-5 py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="alert alert-{{category}} glass border-0">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script>window.CSRF_TOKEN={{ csrf_token|tojson }};</script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="{{ url_for('static',filename='js/app.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
